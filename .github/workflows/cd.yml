name: CD

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/joycenter-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      # docker-compose.yml을 서버로 전송
      - name: docker-compose.yml 서버 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml"
          target: "~/joycenter-server"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: ENV_FILE
          script: |
            # 배포 디렉토리 생성
            mkdir -p ~/joycenter-server

            # .env 파일 갱신
            printf '%s' "$ENV_FILE" > ~/joycenter-server/.env && chmod 600 ~/joycenter-server/.env

            # 최신 이미지 pull
            docker pull ${{ env.IMAGE_NAME }}:latest

            # docker-compose로 컨테이너 실행
            cd ~/joycenter-server
            GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }} docker compose up -d --remove-orphans

            # 사용하지 않는 이전 이미지 정리
            docker image prune -f
