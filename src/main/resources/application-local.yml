server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DIALECT}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

app:
  oauth:
    success-url: http://localhost:5173/oauth/success
    failure-url: http://localhost:5173/oauth/fail

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
