name: CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 이미지 이름 소문자 변환
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/joycenter-server" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: docker-compose.yml 서버 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml"
          target: "~/joycenter-server"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: ENV_FILE
          script: |
            mkdir -p ~/joycenter-server
            printf '%s' "$ENV_FILE" > ~/joycenter-server/.env && chmod 600 ~/joycenter-server/.env
            docker pull ${{ env.IMAGE_NAME }}:latest
            cd ~/joycenter-server
            GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }} docker compose up -d --remove-orphans
            docker image prune -f

      - name: Discord 알림 (성공)
        if: ${{ success() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD }}
          title: '✅ 배포 성공!'
          status: ${{ job.status }}
          description: 'JoyCenter 서버 배포에 성공했습니다.'
          color: 65280
          username: 'JoyCenter-bot'

      - name: Discord 알림 (실패)
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD }}
          title: '❗ 배포 실패!'
          status: ${{ job.status }}
          description: 'JoyCenter 서버 배포에 실패했습니다.'
          color: 16711680
          username: 'JoyCenter-bot'
